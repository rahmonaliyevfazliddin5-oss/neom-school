services:
  - type: web
    name: neom-school
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install && pnpm build
    startCommand: node start-web.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=350
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: 10000
