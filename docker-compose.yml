services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Primary Database)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: neom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neom_secret_pg_2026}
      POSTGRES_DB: ${POSTGRES_DB:-neom_school}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neom_school}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - neom_network

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Cache, Sessions, Rate Limiting)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: neom_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-neom_secret_redis_2026}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-neom_secret_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - neom_network

  # ----------------------------------------------------------------------------
  # 3. NestJS API Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: neom_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-neom_secret_pg_2026}@postgres:5432/${POSTGRES_DB:-neom_school}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-neom_secret_redis_2026}@redis:6379"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-neom_secret_redis_2026}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-neom_school_super_secure_jwt_access_token_secret_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-neom_school_super_secure_jwt_refresh_token_secret_key_2026}
      SEED_DIRECTOR_PASSWORD: ${SEED_DIRECTOR_PASSWORD:-DirectorSecurePassword2026!}
      SEED_ZAVUCH_PASSWORD: ${SEED_ZAVUCH_PASSWORD:-ZavuchSecurePassword2026!}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-TeacherSecurePassword2026!}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neom_network

  # ----------------------------------------------------------------------------
  # 4. Next.js Web Frontend Service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: neom_web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - neom_network

  # ----------------------------------------------------------------------------
  # 5. Nginx Reverse Proxy (HTTPS, Gzip, Rate Limiting)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: neom_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - neom_network

# ------------------------------------------------------------------------------
# Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  neom_network:
    driver: bridge
